<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track your order — My Store</title>
<meta name="description" content="Track your order status by tracking ID.">
<link rel="canonical" href="https://your-domain.com/tracking/">
<meta name="theme-color" content="#0E7C5A">
<link rel="icon" href="/assets/images/icons/favicon.png">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="tracking">

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo" data-site-name>My Store</a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/category/">Categories</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">🌓</button>
      <a href="/login/" class="icon-btn" data-guest-only aria-label="Login">👤</a>
      <a href="/profile/" class="icon-btn" data-auth-only hidden aria-label="Profile">👤</a>
      <button class="menu-toggle" data-menu-toggle aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <nav class="mobile-menu-links" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/category/">Categories</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main class="container section" style="max-width:560px;">
  <h1 style="margin-bottom:8px;">Track your order</h1>
  <p class="text-soft" style="margin-bottom:18px;">Enter the tracking ID you received when you placed the order.</p>

  <form data-tracking-form style="display:flex; gap:8px; margin-bottom:24px;">
    <input class="form-input" id="tracking-id-input" placeholder="im..." required style="margin-bottom:0;">
    <button class="btn btn-primary" type="submit">Track</button>
  </form>

  <div data-tracking-result></div>
</main>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
