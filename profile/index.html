<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — My Store</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E7C5A">
<link rel="icon" href="/assets/images/icons/favicon.png">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
</head>
<body data-page="profile">

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo" data-site-name>My Store</a>
    <nav class="desktop-nav" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/category/">Categories</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">🌓</button>
      <a href="/cart/" class="icon-btn" aria-label="Cart">🛒<span class="cart-badge" data-cart-count>0</span></a>
      <button class="icon-btn" data-logout aria-label="Logout">🚪</button>
      <button class="menu-toggle" data-menu-toggle aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="mobile-menu" data-mobile-menu>
    <nav class="mobile-menu-links" aria-label="Primary">
      <a href="/">Home</a>
      <a href="/category/">Categories</a>
      <a href="/orders/">My Orders</a>
      <a href="/review/">Write a Review</a>
      <a href="/about/">About</a>
      <a href="/contact/">Contact</a>
    </nav>
  </div>
</header>

<main class="container section">
  <h1 style="margin-bottom:18px;">My profile</h1>

  <div class="form-card">
    <h3>Account</h3>
    <p><strong data-profile-name>—</strong></p>
    <p class="text-soft text-sm" data-profile-email>—</p>
    <p class="text-soft text-sm" data-profile-phone>—</p>
    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
      <a class="btn btn-outline btn-sm" href="/orders/">My orders</a>
      <a class="btn btn-outline btn-sm" href="/review/">Write a review</a>
    </div>
  </div>

  <div class="form-card">
    <h3>Saved addresses</h3>
    <div data-profile-addresses></div>

    <form data-profile-address-form style="margin-top:14px;">
      <div class="form-group"><label class="form-label">Recipient name *</label><input class="form-input" name="recipient_name" required></div>
      <div class="form-group"><label class="form-label">Phone *</label><input class="form-input" name="phone" required></div>
      <div class="form-group"><label class="form-label">Address *</label><input class="form-input" name="address_line" required></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Area</label><input class="form-input" name="area"></div>
        <div class="form-group"><label class="form-label">City</label><input class="form-input" name="city"></div>
      </div>
      <button class="btn btn-outline" type="submit">+ Add address</button>
    </form>
  </div>
</main>

<nav class="bottom-nav" aria-label="Primary">
  <a href="/"><span class="icon">🏠</span>Home</a>
  <a href="/category/"><span class="icon">📂</span>Categories</a>
  <a href="/search/"><span class="icon">🔍</span>Search</a>
  <a href="/cart/"><span class="icon">🛒</span>Cart</a>
  <a href="/profile/" class="is-active"><span class="icon">👤</span>Profile</a>
</nav>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
